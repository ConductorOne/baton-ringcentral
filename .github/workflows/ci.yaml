name: ci
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_RINGCENTRAL_CLIENT_ID: ${{ secrets.RINGCENTRAL_CLIENT_ID }}
      BATON_RINGCENTRAL_CLIENT_SECRET: ${{ secrets.RINGCENTRAL_CLIENT_SECRET }}
      BATON_RINGCENTRAL_JWT: ${{ secrets.RINGCENTRAL_JWT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-ringcentral
        run: go build ./cmd/baton-ringcentral
      - name: Run sync test
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-ringcentral
          baton-entitlement: ${{ vars.GRANT_TEST_CONNECTOR_ENTITLEMENT }}
          baton-principal: ${{ vars.GRANT_TEST_CONNECTOR_PRINCIPAL }}
          baton-principal-type: user
          required-secrets: BATON_RINGCENTRAL_CLIENT_ID,BATON_RINGCENTRAL_CLIENT_SECRET,BATON_RINGCENTRAL_JWT
